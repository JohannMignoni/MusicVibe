name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Verificação e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências (npm ci)
        run: npm ci

      - name: Verificar sintaxe dos pontos de entrada
        run: |
          node --check app.js
          node --check bin/www

      - name: Executar testes automatizados
        run: npm test
