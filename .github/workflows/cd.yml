name: CD — Release e Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de incremento SemVer (patch ou minor)'
        required: false
        default: 'minor'
        type: choice
        options:
          - patch
          - minor

permissions:
  contents: write

jobs:
  check-release:
    name: Verificar Elegibilidade de Release
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.eval.outputs.should_release }}
      bump: ${{ steps.eval.outputs.bump }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Avaliar Conventional Commit ou gatilho manual
        id: eval
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MSG=$(git log -1 --pretty=%s)
          echo "Último commit: $MSG"
          if echo "$MSG" | grep -qE '^feat(\(.+\))?!?:'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=minor" >> "$GITHUB_OUTPUT"
          elif echo "$MSG" | grep -qE '^fix(\(.+\))?!?:'; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "bump=none" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Validar Testes antes da Release
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  release-production:
    name: Deploy em Produção e Geração de Release
    needs: [check-release, test]
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout completo (com tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calcular próxima versão SemVer e publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ needs.check-release.outputs.bump }}
        run: |
          LAST_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="v0.1.0"
          else
            VER="${LAST_TAG#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"
            if [ "$BUMP" = "minor" ]; then
              MINOR=$((MINOR + 1))
              PATCH=0
            else
              PATCH=$((PATCH + 1))
            fi
            NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "Última tag: ${LAST_TAG:-nenhuma}"
          echo "Nova tag: $NEW_TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

          gh release create "$NEW_TAG" \
            --title "MusicVibe $NEW_TAG" \
            --generate-notes \
            --latest

          {
            echo "## Deploy em Produção Concluído"
            echo "- **Release publicada:** \`$NEW_TAG\`"
            echo "- **Commit:** \`${GITHUB_SHA}\`"
            echo "- **Ambiente:** \`production\`"
          } >> "$GITHUB_STEP_SUMMARY"
